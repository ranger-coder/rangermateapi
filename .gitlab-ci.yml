stages:
  - test
  - docker-build
  - deploy

default:
  interruptible: true

# 1. Dependency and syntax test
test:backend:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - node -e "require('./server'); console.log('Syntax check passed');"
  only:
    - main
    - tags
    - merge_requests

# 2. Build and push Docker image to GitLab Container Registry
docker:build:
  stage: docker-build
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"
  only:
    - main
    - tags

# 3. Automated deployment via SSH to deployment server (api.mcodellp.com)
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - |
      ssh "$SERVER_USER@$SERVER_HOST" "
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        docker pull '$CI_REGISTRY_IMAGE:latest' &&
        docker stop rangermate-api || true &&
        docker rm rangermate-api || true &&
        docker run -d \
          --name rangermate-api \
          --restart unless-stopped \
          -p 5001:5001 \
          -e PORT=5001 \
          -e NODE_ENV=production \
          -e MONGODB_URI='$MONGODB_URI' \
          -e JWT_SECRET='$JWT_SECRET' \
          '$CI_REGISTRY_IMAGE:latest' &&
        docker image prune -af
      "
  environment:
    name: production
    url: https://api.mcodellp.com
  only:
    - main
  when: manual
